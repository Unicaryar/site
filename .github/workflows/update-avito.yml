name: Обновление Avito и публикация на Timeweb

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: avito-timeweb-sync
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade requests
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Получить автомобили из Avito API
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python update_avito.py

      - name: Проверить изменения каталога
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- cars-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Каталог не изменился"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Каталог изменился"
          fi

      - name: Сохранить каталог в GitHub
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars-data.js
          git commit -m "Автоматическое обновление каталога из Avito"
          git push

      - name: Опубликовать cars-data.js на Timeweb
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        shell: bash
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Не заданы FTP_SERVER, FTP_USERNAME или FTP_PASSWORD"
            exit 1
          fi

          TARGET_DIR="${FTP_TARGET_DIR:-/unicar-yar.ru/public_html}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          set ssl:verify-certificate no
          cd "$TARGET_DIR"
          put cars-data.js -o cars-data.js
          bye
          EOF

          echo "cars-data.js опубликован в $TARGET_DIR"
