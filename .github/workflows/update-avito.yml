name: Avito и публикация сайта на Timeweb

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: unicar-site-deploy
  cancel-in-progress: true

jobs:

  update-avito:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Скачать сайт
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade requests beautifulsoup4

      - name: Получить автомобили из Avito API
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python update_avito.py

      - name: Проверить изменения
        shell: bash
        run: |
          echo "Изменения после обновления Avito:"
          git status --short -- cars-data.js car-images

      - name: Сохранить каталог и фотографии в GitHub
        shell: bash
        run: |

          if [ -z "$(git status --porcelain -- cars-data.js car-images)" ]; then
            echo "Каталог и фотографии не изменились"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cars-data.js

          if [ -d "car-images" ]; then
            git add car-images
          fi

          git commit -m "Автоматическое обновление каталога и фото из Avito [skip ci]"

          git push


  deploy:
    needs: [update-avito]

    if: always() && (
      needs.update-avito.result == 'success' ||
      needs.update-avito.result == 'skipped'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Скачать последнюю версию сайта
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Установить FTP-клиент
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Опубликовать сайт на Timeweb
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}

        shell: bash

        run: |

          TARGET_DIR="${FTP_TARGET_DIR:-/unicar-yar.ru/public_html}"

          echo "Публикация сайта в: $TARGET_DIR"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF

          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no

          cd "$TARGET_DIR"

          mirror -R --verbose --no-perms --no-empty-dirs \
            --exclude-glob ".git/**" \
            --exclude-glob ".github/**" \
            --exclude-glob "__pycache__/**" \
            --exclude-glob "*.pyc" \
            --exclude-glob "*.zip" \
            --exclude-glob "update_avito.py" \
            --exclude-glob "pars.py" \
            --exclude-glob "pars1.py" \
            --exclude-glob "update_cars.py" \
            ./ ./

          bye

          EOF
